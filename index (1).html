<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tazzuba Learn</title>
<meta name="description" content="One short lesson a day from Derrick Sekiziyivu's books: Stoic mindset, leadership, calm and focus.">
<meta name="theme-color" content="#0E0E0E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
<style>
:root{
  --bg:#0E0E0E; --card:#181818; --card2:#202020; --line:#2C2C2C;
  --text:#F5F2EE; --muted:#A39E98; --orange:#FF6A13; --orange-ink:#1A0B02;
  --good:#3DBE7A; --bad:#E5484D;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;font-size:16px;line-height:1.5}
body{min-height:100vh;padding:env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 24px)}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
h1,h2,.display{font-family:"Bebas Neue",Impact,sans-serif;letter-spacing:.02em;font-weight:400}
header.top{display:flex;align-items:center;justify-content:space-between;padding:16px 0}
.brand{font-family:"Bebas Neue";font-size:28px;letter-spacing:.04em}
.brand b{color:var(--orange);font-weight:400}
.pill{font-size:13px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:6px 12px}
.btn{display:block;width:100%;padding:15px 18px;border-radius:14px;font-weight:700;font-size:16px;text-align:center}
.btn-primary{background:var(--orange);color:var(--orange-ink)}
.btn-ghost{border:1px solid var(--line);color:var(--text)}
.btn:disabled{opacity:.5;cursor:default}
.muted{color:var(--muted)}
.small{font-size:13px}
.hero{padding:40px 0 24px}
.hero h1{font-size:64px;line-height:.92}
.hero h1 span{color:var(--orange)}
.hero p{margin:16px 0 28px;color:var(--muted);font-size:17px}
.stack>*+*{margin-top:12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0 24px}
.stat{background:var(--card);border-radius:14px;padding:12px}
.stat .v{font-family:"Bebas Neue";font-size:30px;line-height:1}
.stat .l{font-size:12px;color:var(--muted)}
.track{width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;display:block}
.track+.track{margin-top:12px}
.track h2{font-size:30px;line-height:1}
.track .series{font-size:13px;color:var(--muted);margin:2px 0 12px}
.bar{height:6px;background:var(--card2);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--orange);border-radius:6px}
.back{color:var(--muted);font-size:15px;padding:8px 0}
.list{margin-top:12px}
.row{width:100%;display:flex;align-items:center;gap:14px;padding:14px 4px;border-bottom:1px solid var(--line);text-align:left}
.num{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;background:var(--card2)}
.row.done .num{background:var(--orange);color:var(--orange-ink)}
.row .t{flex:1}
.row .b{font-size:12px;color:var(--muted)}
.lock{font-size:12px;color:var(--orange);border:1px solid var(--orange);border-radius:999px;padding:2px 8px}
.lesson .kicker{font-size:13px;color:var(--orange);font-weight:600;text-transform:uppercase;letter-spacing:.08em;margin-top:8px}
.lesson h1{font-size:46px;line-height:.95;margin:6px 0 4px}
.box{background:var(--card);border-radius:16px;padding:18px;margin-top:16px}
.box h3{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:8px;font-weight:600}
.box.action{border-left:4px solid var(--orange)}
.opt{width:100%;text-align:left;padding:14px;border:1px solid var(--line);border-radius:12px;margin-top:10px;background:var(--card2)}
.opt.right{border-color:var(--good);background:rgba(61,190,122,.12)}
.opt.wrong{border-color:var(--bad);background:rgba(229,72,77,.12)}
.feedback{margin-top:12px;font-weight:600}
.tutor textarea{width:100%;min-height:80px;background:var(--card2);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit;resize:vertical}
.tutor .ans{margin-top:12px;white-space:pre-wrap}
.paywall{text-align:center;padding:32px 0}
.paywall h1{font-size:48px;line-height:.95}
.paywall .price{font-family:"Bebas Neue";font-size:56px;color:var(--orange);margin:12px 0 0}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.on{opacity:1}
footer{margin-top:32px;text-align:center;font-size:12px;color:var(--muted)}
footer a{color:var(--muted)}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="toast" id="toast"></div>
<script>
/* ---------- config ---------- */
const CONFIG = {
  sandbox: false,                 // Production (Mainnet) app
  subscriptionPi: 1,              // display only; the real price lives on the server
  paymentsEnabled: true,
  tutorEnabled: false,            // turned on once the AI key is set on the server
  shareBase: 'https://tazzubalearnpuf6461.pinet.com'
};

/* ---------- state ---------- */
const S = { data:null, user:null, view:'home', track:null, lesson:null };
const store = {
  get(k, d){ try{ const v = localStorage.getItem('tl_'+k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem('tl_'+k, JSON.stringify(v)); }catch(e){} }
};
let progress = store.get('progress', {});     // { "stoic-1": true, ... }
let pass     = store.get('pass', null);      // signed premium pass from the server
let premium  = !!(pass && pass.expires > Date.now());
let accessToken = null;                        // kept in memory only
let streak   = store.get('streak', {count:0, last:null});

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),2400); }

/* ---------- Pi auth ---------- */
const inPi = () => typeof window.Pi !== 'undefined';
try { if (inPi()) Pi.init({ version: "2.0", sandbox: CONFIG.sandbox }); } catch(e) {}

const post = (url, body) => fetch(url, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)}).then(r => r.json());
function savePass(p){ pass = p; premium = !!(p && p.expires > Date.now()); store.set('pass', p); }

function onIncompletePaymentFound(payment){
  // A payment was paid but never finished (e.g. the app closed). Let the server finish it.
  post('/api/pi?action=incomplete', {payment}).then(j => {
    if (j.premium && (!S.user || S.user.uid === j.uid)) { savePass({token:j.token, expires:j.expires}); render(); toast('Premium unlocked'); }
  }).catch(()=>{});
}

async function refreshPremium(){
  if (!pass || !accessToken) return;
  try { const j = await post('/api/pi?action=entitlement', {token: pass.token, accessToken}); if (!j.premium) savePass(null); else savePass({token: pass.token, expires: j.expires}); render(); } catch(e) {}
}

async function signIn(quiet){
  if (!inPi()) { if(!quiet) toast('Open Tazzuba Learn in Pi Browser to sign in'); return false; }
  const btn = $('#signin'); if (btn){ btn.disabled = true; btn.textContent = 'Signing in…'; }
  try {
    const scopes = ['username','payments'];
    const auth = await Promise.race([
      Pi.authenticate(scopes, onIncompletePaymentFound),
      new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')), 20000))
    ]);
    const r = await fetch('/api/auth', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({accessToken: auth.accessToken})});
    if (!r.ok) throw new Error('verify failed');
    const u = await r.json();
    if (S.user && S.user.uid !== u.uid) savePass(null);   // different person on this device
    S.user = u; accessToken = auth.accessToken;
    store.set('user', S.user);
    refreshPremium();
    if (!quiet){ toast('Welcome, @' + S.user.username); go('tracks'); }
    return true;
  } catch(e) {
    if (!quiet) toast(e.message === 'timeout' ? 'Sign-in timed out. Open the app in Pi Browser.' : 'Sign-in failed. Please try again.');
    if (btn){ btn.disabled = false; btn.textContent = 'Sign in with Pi'; }
    return false;
  }
}

/* ---------- helpers ---------- */
const key = (t,n) => t + '-' + n;
const doneCount = t => t.lessons.filter(l => progress[key(t.id,l.n)]).length;
const totalDone = () => Object.values(progress).filter(Boolean).length;
const canOpen = l => l.free || premium;

function markDone(t,l){
  if (progress[key(t.id,l.n)]) return;
  progress[key(t.id,l.n)] = true; store.set('progress', progress);
  const today = new Date().toISOString().slice(0,10);
  const yest  = new Date(Date.now()-864e5).toISOString().slice(0,10);
  if (streak.last !== today){ streak.count = streak.last === yest ? streak.count + 1 : 1; streak.last = today; store.set('streak', streak); }
}

function go(view, track, lesson){ S.view=view; if(track!==undefined) S.track=track; if(lesson!==undefined) S.lesson=lesson; render(); window.scrollTo(0,0); }

/* ---------- views ---------- */
function header(){
  const who = S.user ? '@'+esc(S.user.username) : 'Guest';
  return `<header class="top"><div class="brand">TAZZUBA <b>LEARN</b></div><span class="pill">${who}${premium?' · Premium':''}</span></header>`;
}
function foot(){ return `<footer>Lessons from the books of Derrick Sekiziyivu · <a href="/privacy.html">Privacy</a> · <a href="/terms.html">Terms</a></footer>`; }

function viewHome(){
  return `${header()}
  <section class="hero">
    <h1>One lesson.<br><span>Every day.</span></h1>
    <p>Short lessons from the Tazzuba books on Stoic thinking, leadership, and calm focus. Each one gives you a big idea, one thing to try today, and a quick quiz.</p>
    <div class="stack">
      <button class="btn btn-primary" id="signin" onclick="signIn()">Sign in with Pi</button>
      <button class="btn btn-ghost" onclick="go('tracks')">Look around first</button>
    </div>
  </section>
  <p class="small muted">The first 3 lessons in every track are free.</p>${foot()}`;
}

function viewTracks(){
  const tracks = S.data.tracks.map((t,i)=>{
    const d = doneCount(t), n = t.lessons.length;
    return `<button class="track" onclick="go('track',${i})">
      <h2>${esc(t.name)}</h2><div class="series">${esc(t.series)} · ${n} lessons</div>
      <div class="bar"><i style="width:${Math.round(d/n*100)}%"></i></div>
      <div class="small muted" style="margin-top:6px">${d} of ${n} done</div></button>`;
  }).join('');
  return `${header()}
  <div class="stats">
    <div class="stat"><div class="v">${streak.count}</div><div class="l">day streak</div></div>
    <div class="stat"><div class="v">${totalDone()}</div><div class="l">lessons done</div></div>
    <div class="stat"><div class="v">${S.data.tracks.length}</div><div class="l">tracks</div></div>
  </div>
  ${tracks}
  <div class="stack" style="margin-top:20px">
    ${premium ? '' : `<button class="btn btn-primary" onclick="go('paywall')">Unlock every lesson</button>`}
    <button class="btn btn-ghost" onclick="invite()">Invite a friend</button>
  </div>${foot()}`;
}

function viewTrack(){
  const t = S.data.tracks[S.track];
  const rows = t.lessons.map((l,i)=>{
    const done = progress[key(t.id,l.n)];
    return `<button class="row ${done?'done':''}" onclick="${canOpen(l)?`go('lesson',${S.track},${i})`:`go('paywall')`}">
      <span class="num">${done?'✓':l.n}</span>
      <span class="t">${esc(l.title)}<div class="b">${esc(l.book)}</div></span>
      ${canOpen(l)?'':'<span class="lock">Premium</span>'}</button>`;
  }).join('');
  return `${header()}<button class="back" onclick="go('tracks')">← All tracks</button>
  <h1 style="font-size:44px;line-height:1">${esc(t.name)}</h1>
  <div class="muted small">${esc(t.series)}</div>
  <div class="list">${rows}</div>${foot()}`;
}

function viewLesson(){
  const t = S.data.tracks[S.track], l = t.lessons[S.lesson];
  const opts = l.quiz.options.map((o,i)=>`<button class="opt" data-i="${i}" onclick="answer(${i})">${esc(o)}</button>`).join('');
  const next = t.lessons[S.lesson+1];
  return `${header()}<button class="back" onclick="go('track',${S.track})">← ${esc(t.name)}</button>
  <article class="lesson">
    <div class="kicker">Lesson ${l.n} · ${esc(l.book)}</div>
    <h1>${esc(l.title)}</h1>
    <div class="box"><h3>The idea</h3><p>${esc(l.idea)}</p></div>
    <div class="box action"><h3>Try this today</h3><p>${esc(l.action)}</p></div>
    <div class="box"><h3>Quick quiz</h3><p><strong>${esc(l.quiz.q)}</strong></p>${opts}<div class="feedback" id="fb"></div></div>
    <div class="box tutor"><h3>Ask the tutor</h3>
      <textarea id="q" placeholder="Ask anything about this lesson, e.g. how do I use this at work?"></textarea>
      <button class="btn btn-ghost" style="margin-top:10px" onclick="askTutor()">Ask</button>
      <div class="ans" id="ans"></div></div>
    <div class="stack" style="margin-top:20px">
      ${next ? `<button class="btn btn-primary" onclick="${canOpen(next)?`go('lesson',${S.track},${S.lesson+1})`:`go('paywall')`}">Next lesson →</button>` : `<button class="btn btn-primary" onclick="go('tracks')">Track complete, pick another</button>`}
    </div>
  </article>${foot()}`;
}

function viewPaywall(){
  return `${header()}<button class="back" onclick="go('tracks')">← Back</button>
  <section class="paywall">
    <h1>Unlock the<br>full library</h1>
    <p class="muted" style="margin-top:12px">All ${S.data.tracks.reduce((a,t)=>a+t.lessons.length,0)} lessons, every track, and unlimited questions to the AI tutor.</p>
    <div class="price">${CONFIG.subscriptionPi} π</div><div class="muted small">per month</div>
    <div class="stack" style="margin-top:24px">
      <button class="btn btn-primary" id="pay" onclick="subscribe()">${premium ? 'You are Premium ✓' : 'Subscribe with Pi'}</button>
    </div>
    ${premium && pass ? `<p class="small muted" style="margin-top:12px">Premium until ${new Date(pass.expires).toLocaleDateString()}</p>` : `<p class="small muted" style="margin-top:12px">One payment of ${CONFIG.subscriptionPi} π gives you 30 days. It does not renew by itself.</p>`}
  </section>${foot()}`;
}

function render(){
  if (!S.data){ $('#app').innerHTML = `${header()}<p class="muted" style="padding:40px 0">Loading lessons…</p>`; return; }
  const v = {home:viewHome, tracks:viewTracks, track:viewTrack, lesson:viewLesson, paywall:viewPaywall}[S.view] || viewHome;
  $('#app').innerHTML = v();
}

/* ---------- actions ---------- */
function answer(i){
  const t = S.data.tracks[S.track], l = t.lessons[S.lesson];
  document.querySelectorAll('.opt').forEach(b=>{ b.disabled = true; const j=+b.dataset.i; if(j===l.quiz.answer) b.classList.add('right'); else if(j===i) b.classList.add('wrong'); });
  const ok = i === l.quiz.answer;
  $('#fb').textContent = ok ? 'Correct. Lesson complete.' : 'Not quite. The right answer is highlighted, and the lesson still counts.';
  markDone(t,l);
}

async function askTutor(){
  const q = $('#q').value.trim(); if(!q) return;
  const t = S.data.tracks[S.track], l = t.lessons[S.lesson];
  const out = $('#ans');
  if (!CONFIG.tutorEnabled){ out.textContent = 'The AI tutor is being switched on. Check back soon.'; return; }
  out.textContent = 'Thinking…';
  try{
    const r = await fetch('/api/tutor', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({track:t.id, lesson:l.n, question:q, uid:S.user?.uid})});
    const j = await r.json(); out.textContent = j.answer || j.error || 'No answer, try again.';
  }catch(e){ out.textContent = 'Could not reach the tutor. Try again.'; }
}

async function subscribe(){
  if (premium){ go('tracks'); return; }
  if (!inPi()){ toast('Open Tazzuba Learn in Pi Browser to subscribe'); return; }
  if (!accessToken && !(await signIn(true))){ toast('Sign in with Pi first'); return; }
  const btn = $('#pay'); if (btn){ btn.disabled = true; btn.textContent = 'Opening Pi wallet…'; }
  const reset = () => { const b=$('#pay'); if(b){ b.disabled=false; b.textContent='Subscribe with Pi'; } };
  try {
    Pi.createPayment(
      { amount: CONFIG.subscriptionPi, memo: 'Tazzuba Learn Premium (1 month)', metadata: { product: 'premium_month' } },
      {
        onReadyForServerApproval: (paymentId) => post('/api/pi?action=approve', {paymentId, accessToken}).then(j => { if (j.error) toast(j.error); }),
        onReadyForServerCompletion: (paymentId, txid) => post('/api/pi?action=complete', {paymentId, txid, accessToken}).then(j => {
          if (j.premium){ savePass({token:j.token, expires:j.expires}); toast('Premium unlocked. Enjoy!'); go('tracks'); }
          else { toast(j.error || 'Could not finish the payment'); reset(); }
        }),
        onCancel: () => { toast('Payment cancelled'); reset(); },
        onError: (err) => { toast('Payment error: ' + (err && err.message || 'try again')); reset(); }
      }
    );
  } catch(e){ toast('Could not start the payment'); reset(); }
}

function invite(){
  const url = CONFIG.shareBase + '/?ref=' + encodeURIComponent(S.user?.username || 'friend');
  const text = 'I\'m learning one short lesson a day on Tazzuba Learn. Join me: ' + url;
  if (inPi() && Pi.openShareDialog){ try{ Pi.openShareDialog('Tazzuba Learn', text); return; }catch(e){} }
  if (navigator.share){ navigator.share({title:'Tazzuba Learn', text, url}).catch(()=>{}); return; }
  navigator.clipboard?.writeText(text).then(()=>toast('Invite link copied'), ()=>toast(url));
}

/* ---------- boot ---------- */
S.user = store.get('user', null);
if (S.user) S.view = 'tracks';
render();
if (S.user && inPi()) signIn(true);   // quietly refresh the Pi session (needed for payments)
fetch('/lessons.json').then(r=>r.json()).then(d=>{ S.data=d; render(); }).catch(()=>{ $('#app').innerHTML = header()+'<p class="muted" style="padding:40px 0">Could not load lessons. Check your connection and reload.</p>'; });
</script>
</body>
</html>
